[project]
name = "manimations"
version = "0.1.0"
description = "计算机图形学教学动画库：主题、组件与幻灯片式分镜"
readme = "README.md"
authors = [{ name = "PrimeChuJiang", email = "1349511491@qq.com" }]
requires-python = ">=3.13"
dependencies = [
    "manim>=0.22.0,<0.23",
    "numpy>=2.0",
    "cgviz",
]

[project.scripts]
dsh = "manimations.cli:main"

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"
